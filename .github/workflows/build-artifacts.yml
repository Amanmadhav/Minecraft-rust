name: Build Horizon Binaries

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Strip deny(warnings) from source and manifests
        shell: bash
        run: |
          find . -name "*.rs" -o -name "Cargo.toml" | xargs sed -i 's/deny(warnings)/warn(warnings)/g; s/warnings = "deny"/warnings = "warn"/g'

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            launcher

      - name: Build client and server binaries
        run: cargo build --release --bin horizon-client --bin horizon-server

      - name: Build launcher binary
        working-directory: launcher
        run: cargo build --release --bin horizon-launcher

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/horizon-client.exe dist/
          cp target/release/horizon-server.exe dist/
          cp launcher/target/release/horizon-launcher.exe dist/

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: horizon-windows-x64
          path: dist/
