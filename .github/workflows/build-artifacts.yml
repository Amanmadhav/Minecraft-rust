name: Build Horizon Binaries

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            ext: .exe
          - os: ubuntu-latest
            target: linux-x64
            ext: ""
          - os: macos-latest
            target: macos-arm64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux audio and udev headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            launcher

      - name: Build client and server binaries
        run: cargo build --release --bin horizon-client --bin horizon-server

      - name: Build launcher binary
        working-directory: launcher
        run: cargo build --release --bin horizon-launcher

      - name: Package binaries
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/horizon-client${{ matrix.ext }} dist/
          cp target/release/horizon-server${{ matrix.ext }} dist/
          cp launcher/target/release/horizon-launcher${{ matrix.ext }} dist/

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: horizon-${{ matrix.target }}
          path: dist/
